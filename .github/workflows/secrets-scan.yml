# STARTER - scans for secrets but never fails.
name: secrets-scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.29.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan the whole history
        run: ./gitleaks git . --redact --verbose --report-format json --report-path gitleaks-report.json
