# Lab 12 reference: secret scanning that blocks. Historic findings are listed in .gitleaksignore only after revocation.
name: secrets-scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.29.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan the whole history (fails on any finding not revoked and listed)
        run: ./gitleaks git . --redact --verbose
